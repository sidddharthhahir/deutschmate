<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DeutschMate">
  <!-- Maskable: Android crops to a circle, so everything that matters stays
       inside the safe zone (the middle 80%). Full-bleed background, smaller
       glyph than the plain icon. -->
